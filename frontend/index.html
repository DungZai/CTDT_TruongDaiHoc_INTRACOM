<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Intracom — Đăng nhập</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;min-height:100vh;
     background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%);
     display:flex;align-items:center;justify-content:center;padding:16px}

.card{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.2);
      width:100%;max-width:440px;overflow:hidden}

/* Header */
.card-header{background:linear-gradient(135deg,#1e3a5f,#2563eb);
             padding:30px 32px 26px;text-align:center;color:#fff}
.logo{width:60px;height:60px;background:rgba(255,255,255,.15);border-radius:14px;
      display:flex;align-items:center;justify-content:center;
      margin:0 auto 12px;font-size:26px;font-weight:800;
      border:2px solid rgba(255,255,255,.25)}
.card-header h1{font-size:19px;font-weight:700;margin-bottom:3px}
.card-header p{font-size:12px;opacity:.75}

/* Tabs */
.tabs{display:flex;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.tab{flex:1;padding:13px;text-align:center;font-size:13px;font-weight:500;
     color:#94a3b8;cursor:pointer;border-bottom:3px solid transparent;transition:.2s}
.tab.active{color:#2563eb;border-bottom-color:#2563eb;background:#fff}
.tab:hover:not(.active){color:#475569;background:#f1f5f9}

/* Body */
.card-body{padding:26px 30px 28px}
.panel{display:none}
.panel.active{display:block}

/* Form */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:500;color:#374151;margin-bottom:5px}
.input-wrap{position:relative}
.input-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:15px;color:#94a3b8}
.form-group input,.form-group select{
  width:100%;padding:9px 12px 9px 36px;
  border:1.5px solid #e2e8f0;border-radius:9px;
  font-size:13px;color:#1e293b;background:#f8fafc;outline:none;transition:.2s}
.form-group input:focus,.form-group select:focus{
  border-color:#2563eb;background:#fff;
  box-shadow:0 0 0 3px rgba(37,99,235,.09)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pwd-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);
         background:none;border:none;cursor:pointer;font-size:15px;color:#94a3b8}

/* Alert */
.alert{padding:9px 13px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.alert-error{background:#fef2f2;border:1px solid #fecaca;color:#dc2626}
.alert-success{background:#f0fdf4;border:1px solid #bbf7d0;color:#16a34a}

/* Button */
.btn-submit{width:100%;padding:11px;border:none;border-radius:9px;
            font-size:14px;font-weight:600;cursor:pointer;transition:.2s;
            background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;margin-top:4px}
.btn-submit:hover{background:linear-gradient(135deg,#1d4ed8,#1e40af);
                  transform:translateY(-1px);box-shadow:0 4px 14px rgba(37,99,235,.35)}
.btn-submit:disabled{background:#93c5fd;cursor:not-allowed;transform:none;box-shadow:none}

/* Strength */
.strength-bar{height:3px;background:#e2e8f0;border-radius:2px;margin:5px 0 2px;overflow:hidden}
.strength-fill{height:100%;border-radius:2px;transition:.3s;width:0}
.strength-text{font-size:11px}

/* Switch link */
.switch-link{text-align:center;font-size:13px;color:#64748b;margin-top:14px}
.switch-link a{color:#2563eb;font-weight:500;cursor:pointer}
.switch-link a:hover{text-decoration:underline}

/* Footer */
.card-footer{background:#f8fafc;border-top:1px solid #e2e8f0;
             padding:11px 30px;text-align:center;font-size:11px;color:#94a3b8}
</style>
</head>
<body>

<div class="card">
  <!-- Header -->
  <div class="card-header">
    <div class="logo">I</div>
    <h1>Intracom University</h1>
    <p>Hệ thống quản lý chương trình đào tạo</p>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">🔑 Đăng nhập</div>
    <div class="tab" id="tab-register" onclick="switchTab('register')">📝 Đăng ký</div>
  </div>

  <!-- Body -->
  <div class="card-body">

    <!-- LOGIN -->
    <div class="panel active" id="panel-login">
      <div class="alert alert-error"   id="login-err"></div>
      <div class="alert alert-success" id="login-ok"></div>

      <div class="form-group">
        <label>Tên đăng nhập</label>
        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input type="text" id="l-user" placeholder="Nhập username"
                 onkeydown="if(event.key==='Enter')doLogin()"/>
        </div>
      </div>

      <div class="form-group">
        <label>Mật khẩu</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="l-pass" placeholder="Nhập mật khẩu"
                 onkeydown="if(event.key==='Enter')doLogin()"/>
          <button class="pwd-btn" type="button" onclick="togglePwd('l-pass',this)">👁️</button>
        </div>
      </div>

      <button class="btn-submit" id="btn-login" onclick="doLogin()">Đăng nhập</button>

      <div class="switch-link">
        Chưa có tài khoản? <a onclick="switchTab('register')">Đăng ký ngay</a>
      </div>
    </div>

    <!-- REGISTER -->
    <div class="panel" id="panel-register">
      <div class="alert alert-error"   id="reg-err"></div>
      <div class="alert alert-success" id="reg-ok"></div>

      <div class="form-group">
        <label>Tên đăng nhập *</label>
        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input type="text" id="r-user" placeholder="Tối thiểu 4 ký tự"/>
        </div>
      </div>

      <div class="form-group">
        <label>Email *</label>
        <div class="input-wrap">
          <span class="input-icon">📧</span>
          <input type="email" id="r-email" placeholder="example@intracom.edu.vn"/>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Mật khẩu *</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="r-pass" placeholder="Tối thiểu 6 ký tự"
                   oninput="checkStrength(this.value)"/>
            <button class="pwd-btn" type="button" onclick="togglePwd('r-pass',this)">👁️</button>
          </div>
          <div class="strength-bar"><div class="strength-fill" id="s-fill"></div></div>
          <div class="strength-text" id="s-text"></div>
        </div>
        <div class="form-group">
          <label>Xác nhận MK *</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="r-pass2" placeholder="Nhập lại"/>
            <button class="pwd-btn" type="button" onclick="togglePwd('r-pass2',this)">👁️</button>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Vai trò</label>
        <div class="input-wrap">
          <span class="input-icon">🎭</span>
          <select id="r-role"><option value="">-- Đang tải... --</option></select>
        </div>
      </div>

      <button class="btn-submit" id="btn-reg" onclick="doRegister()">Tạo tài khoản</button>

      <div class="switch-link">
        Đã có tài khoản? <a onclick="switchTab('login')">Đăng nhập</a>
      </div>
    </div>
  </div>

  <div class="card-footer">© 2024 Intracom University — Phòng Đào tạo</div>
</div>

<script>
const API = 'http://localhost:8080';

// Không tự redirect — chỉ vào dashboard khi đăng nhập thành công

function switchTab(tab) {
  ['login','register'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
    document.getElementById('panel-'+t).classList.toggle('active', t===tab);
  });
  clearAlerts();
  if (tab === 'register') loadRoles();
}

function clearAlerts() {
  document.querySelectorAll('.alert').forEach(e => { e.style.display='none'; e.textContent=''; });
}

function showAlert(id, msg, type='error') {
  const el = document.getElementById(id);
  el.textContent = (type==='error'?'❌ ':'✅ ') + msg;
  el.className = 'alert alert-' + (type==='error'?'error':'success');
  el.style.display = 'block';
}

function togglePwd(id, btn) {
  const inp = document.getElementById(id);
  inp.type = inp.type==='password' ? 'text' : 'password';
  btn.textContent = inp.type==='password' ? '👁️' : '🙈';
}

function checkStrength(v) {
  const fill = document.getElementById('s-fill');
  const text = document.getElementById('s-text');
  if (!v) { fill.style.width='0'; text.textContent=''; return; }
  let s = 0;
  if (v.length>=6) s++; if (v.length>=10) s++;
  if (/[A-Z]/.test(v)) s++; if (/[0-9]/.test(v)) s++;
  if (/[^A-Za-z0-9]/.test(v)) s++;
  const lv = [{w:'20%',c:'#ef4444',t:'Rất yếu'},{w:'40%',c:'#f97316',t:'Yếu'},
              {w:'60%',c:'#eab308',t:'Trung bình'},{w:'80%',c:'#22c55e',t:'Mạnh'},
              {w:'100%',c:'#16a34a',t:'Rất mạnh'}][Math.min(s-1,4)] || {w:'20%',c:'#ef4444',t:'Rất yếu'};
  fill.style.width=lv.w; fill.style.background=lv.c;
  text.textContent=lv.t; text.style.color=lv.c;
}

async function loadRoles() {
  try {
    const r = await fetch(API+'/api/roles');
    const json = await r.json();
    const roles = json.data || [];
    document.getElementById('r-role').innerHTML =
      roles.map(r=>`<option value="${r.id}">${r.roleName}</option>`).join('');
  } catch {
    document.getElementById('r-role').innerHTML =
      '<option value="1">ADMIN</option><option value="2">USER</option>';
  }
}

async function doLogin() {
  clearAlerts();
  const username = document.getElementById('l-user').value.trim();
  const password = document.getElementById('l-pass').value.trim();
  if (!username || !password) { showAlert('login-err','Vui lòng nhập đầy đủ thông tin'); return; }

  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = 'Đang đăng nhập...';

  try {
    const r = await fetch(API+'/api/auth/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username, password})
    });
    const json = await r.json();
    if (!r.ok) throw new Error(json.message || 'Sai tên đăng nhập hoặc mật khẩu');

    const data = json.data;
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data));
    showAlert('login-ok', 'Đăng nhập thành công! Đang chuyển hướng...', 'success');
    setTimeout(() => window.location.href = 'pages/dashboard.html', 800);
  } catch(e) {
    showAlert('login-err', e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Đăng nhập';
  }
}

async function doRegister() {
  clearAlerts();
  const username = document.getElementById('r-user').value.trim();
  const email    = document.getElementById('r-email').value.trim();
  const password = document.getElementById('r-pass').value.trim();
  const pass2    = document.getElementById('r-pass2').value.trim();
  const roleId   = document.getElementById('r-role').value;

  if (!username || username.length < 4) { showAlert('reg-err','Tên đăng nhập tối thiểu 4 ký tự'); return; }
  if (!email || !email.includes('@'))   { showAlert('reg-err','Email không đúng định dạng'); return; }
  if (!password || password.length < 6) { showAlert('reg-err','Mật khẩu tối thiểu 6 ký tự'); return; }
  if (password !== pass2)               { showAlert('reg-err','Mật khẩu xác nhận không khớp'); return; }

  const btn = document.getElementById('btn-reg');
  btn.disabled = true; btn.textContent = 'Đang xử lý...';

  try {
    const r = await fetch(API+'/api/auth/register', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username, email, password, roleId: +roleId})
    });
    const json = await r.json();
    if (!r.ok) throw new Error(json.message || 'Đăng ký thất bại');

    showAlert('reg-ok','Đăng ký thành công! Vui lòng đăng nhập.','success');
    setTimeout(() => switchTab('login'), 1500);
  } catch(e) {
    showAlert('reg-err', e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Tạo tài khoản';
  }
}
</script>
</body>
</html>
