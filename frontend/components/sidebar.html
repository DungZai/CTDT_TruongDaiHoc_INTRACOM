<style>
.nav-group-label {
  padding: 8px 16px 3px;
  font-size: 10px; font-weight: 600;
  color: #475569; letter-spacing: .08em; text-transform: uppercase;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px;
  font-size: 13px; color: #94a3b8;
  text-decoration: none;
  border-left: 3px solid transparent;
  transition: .15s;
}
.nav-item:hover { background: #273549; color: #e2e8f0; }
.nav-item.active { background: #1e3a5f; color: #60a5fa; border-left-color: #2563eb; }
</style>

<script>
// Tự động highlight menu đang active
(function() {
  const path = window.location.pathname;
  document.querySelectorAll('.nav-item').forEach(a => {
    if (path.includes(a.getAttribute('href'))) a.classList.add('active');
  });

  // Hiển thị tên user
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  if (user.username) {
    document.getElementById('sb-name').textContent = user.username;
    document.getElementById('sb-role').textContent = user.role || '';
    document.getElementById('avatar').textContent = user.username[0].toUpperCase();
  }
})();
</script>
