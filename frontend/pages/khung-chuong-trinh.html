<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Khung chương trình — QLCTĐT</title>
  <link rel="stylesheet" href="../libs/bootstrap.min.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/table.css">
  <link rel="stylesheet" href="../css/form.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/topbar.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/modal.css">
  <style>
    /* ── Header bar ── */
    .khung-header {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .khung-ct-select {
      flex: 1;
      min-width: 260px;
      max-width: 360px;
    }
    .khung-stat {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .khung-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    /* ── Tab học kỳ ── */
    .hk-tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 0;
    }
    .hk-tab {
      padding: 7px 16px;
      border: none;
      background: none;
      font-size: 13px;
      font-weight: 500;
      color: #64748b;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all .15s;
      border-radius: 6px 6px 0 0;
    }
    .hk-tab:hover { color: #6366f1; background: #f1f5f9; }
    .hk-tab.active {
      color: #6366f1;
      border-bottom-color: #6366f1;
      background: #f5f3ff;
      font-weight: 600;
    }
    .hk-tab .tc-badge {
      display: inline-block;
      background: #e0e7ff;
      color: #4338ca;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 11px;
      margin-left: 4px;
    }
    .hk-tab.active .tc-badge {
      background: #6366f1;
      color: #fff;
    }

    /* ── Bảng môn học ── */
    .khung-table-wrap {
      background: #fff;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
    }
    .khung-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .khung-table thead tr {
      background: #f8fafc;
      border-bottom: 2px solid #e2e8f0;
    }
    .khung-table thead th {
      padding: 10px 14px;
      font-weight: 600;
      color: #475569;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .4px;
      white-space: nowrap;
    }
    .khung-table tbody tr {
      border-bottom: 1px solid #f1f5f9;
      transition: background .1s;
    }
    .khung-table tbody tr:last-child { border-bottom: none; }
    .khung-table tbody tr:hover { background: #f8fafc; }
    .khung-table td {
      padding: 10px 14px;
      color: #1e293b;
      vertical-align: middle;
    }
    .khung-table .td-ma {
      font-weight: 600;
      color: #6366f1;
      font-size: 12px;
      white-space: nowrap;
    }
    .khung-table .td-ten { font-weight: 500; }
    .khung-table .td-tc {
      text-align: center;
      font-weight: 700;
      color: #0f172a;
    }
    .tag-loai {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .tag-bb  { background: #dcfce7; color: #15803d; }
    .tag-tc  { background: #fef9c3; color: #854d0e; }
    .tag-tn  { background: #fce7f3; color: #9d174d; }
    .tag-nhom {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      background: #f1f5f9;
      color: #475569;
    }

    /* ── Actions ── */
    .khung-actions { white-space: nowrap; text-align: right; }
    .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      transition: all .15s;
    }
    .btn-icon-edit  { background: #fef3c7; color: #d97706; }
    .btn-icon-edit:hover  { background: #fde68a; }
    .btn-icon-del   { background: #fee2e2; color: #dc2626; }
    .btn-icon-del:hover   { background: #fecaca; }

    /* ── Empty state ── */
    .khung-empty {
      text-align: center;
      padding: 48px 24px;
      color: #94a3b8;
    }
    .khung-empty svg { margin-bottom: 12px; opacity: .4; }

    /* ── Summary footer ── */
    .khung-summary {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      padding: 10px 16px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      font-size: 12px;
      color: #64748b;
    }
    .khung-summary strong { color: #1e293b; }
  </style>
</head>
<body>
<main class="main-content">
  <div class="page-header">
    <div><h5>Khung chương trình đào tạo</h5></div>
    <button class="btn btn-primary btn-sm" onclick="openKhung()" data-role="ADMIN">+ Thêm môn</button>
  </div>

  <!-- Header bar -->
  <div class="khung-header">
    <select id="sel-khung-ct" class="form-select form-select-sm khung-ct-select"
      onchange="loadKhung(this.value)"></select>
    <div class="khung-stat">
      <span class="khung-badge" id="lbl-tong-tc">📚 Tổng: 0 TC</span>
      <span class="khung-badge" id="lbl-so-mon" style="background:#f0fdf4;color:#15803d;border-color:#bbf7d0">📋 0 môn</span>
    </div>
  </div>

  <!-- Tab học kỳ -->
  <div id="hk-tabs-wrap" style="display:none">
    <div class="hk-tabs" id="hk-tabs"></div>
    <div id="wrap-khung-table"></div>
  </div>

  <div id="wrap-khung-empty">
    <p class="text-muted mt-3">Chọn chương trình để xem khung.</p>
  </div>
</main>

<!-- Modal -->
<div class="modal fade" id="modal-khung" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header">
      <h6 class="modal-title" id="modal-khung-title">Thêm môn vào khung</h6>
      <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body row g-2">
      <div class="col-12">
        <label class="form-label">Môn học <span class="text-danger">*</span></label>
        <select id="inp-khung-mon" class="form-select form-select-sm"></select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Học kỳ</label>
        <select id="inp-khung-hk" class="form-select form-select-sm">
          <option value="1">Học kỳ 1</option><option value="2">Học kỳ 2</option>
          <option value="3">Học kỳ 3</option><option value="4">Học kỳ 4</option>
          <option value="5">Học kỳ 5</option><option value="6">Học kỳ 6</option>
          <option value="7">Học kỳ 7</option><option value="8">Học kỳ 8</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Loại môn</label>
        <select id="inp-khung-loai" class="form-select form-select-sm">
          <option>Bắt buộc</option><option>Tự chọn</option><option>Tốt nghiệp</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">Nhóm kiến thức</label>
        <select id="inp-khung-nhom" class="form-select form-select-sm">
          <option>Đại cương</option>
          <option>Cơ sở ngành</option>
          <option>Thực hành</option>
          <option>Chuyên ngành</option>
          <option>Tốt nghiệp</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Thứ tự</label>
        <input type="number" id="inp-khung-thutu" class="form-control form-control-sm" value="1" min="1">
      </div>
      <div class="col-12">
        <label class="form-label">Ghi chú</label>
        <textarea id="inp-khung-ghichu" class="form-control form-control-sm" rows="2"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Hủy</button>
      <button class="btn btn-primary btn-sm" onclick="saveKhung()">Lưu</button>
    </div>
  </div></div>
</div>

<script src="../libs/bootstrap.bundle.min.js"></script>
<script src="../libs/sweetalert2.all.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/auth/token.js"></script>
<script src="../js/auth/guard.js"></script>
<script src="../js/auth/permission.js"></script>
<script src="../js/components/loading.js"></script>
<script src="../js/components/toast.js"></script>
<script src="../js/components/confirm.js"></script>
<script src="../js/components/modal.js"></script>
<script src="../js/components/datatable.js"></script>
<script src="../js/components/sidebar.js"></script>
<script src="../js/components/topbar.js"></script>
<script src="../js/api/client.js"></script>
<script src="../js/api/authApi.js"></script>
<script src="../js/api/chuongTrinhApi.js"></script>
<script src="../js/api/khungApi.js"></script>
<script src="../js/api/monHocApi.js"></script>
<script src="../js/utils/constants.js"></script>
<script src="../js/utils/formatter.js"></script>
<script src="../js/utils/validator.js"></script>
<script src="../js/pages/khungChuongTrinh.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', async () => {
    await loadTopbar();
    await loadSidebar();
    initKhung();
  });
</script>
</body>
</html>
