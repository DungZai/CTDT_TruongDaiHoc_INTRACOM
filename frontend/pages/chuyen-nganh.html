<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chuyên ngành — QLCTĐT</title>
  <link rel="stylesheet" href="../libs/bootstrap.min.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/table.css">
  <link rel="stylesheet" href="../css/form.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/topbar.css">
  <link rel="stylesheet" href="../css/sidebar.css">
</head>
<body>
<main class="main-content">
  <div class="page-header">
    <div><h5>Chuyên ngành</h5></div>
    <button class="btn btn-primary btn-sm" onclick="openCN()" data-role="ADMIN">+ Thêm</button>
  </div>
  <div class="filter-bar">
    <select id="sel-cn-nganh-filter" class="form-select form-select-sm" style="width:200px"
      onchange="filterCN()"></select>
    <input type="text" id="inp-search-cn" class="form-control form-control-sm" style="width:220px"
      placeholder="Tìm kiếm..." autocomplete="off" oninput="filterCN()">
  </div>
  <div class="table-responsive">
    <table class="table table-hover">
      <thead><tr><th>#</th><th>Tên chuyên ngành</th><th>Thuộc ngành</th><th>Trạng thái</th><th></th></tr></thead>
      <tbody id="tbody-cn"></tbody>
    </table>
  </div>
</main>

<div class="modal fade" id="modal-cn" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header">
      <h6 class="modal-title" id="modal-cn-title">Thêm chuyên ngành</h6>
      <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">
      <div class="mb-2">
        <label class="form-label">Ngành <span class="text-danger">*</span></label>
        <select id="sel-cn-nganh" class="form-select form-select-sm"></select>
      </div>
      <div class="mb-2">
        <label class="form-label">Tên chuyên ngành <span class="text-danger">*</span></label>
        <input type="text" id="inp-ten-cn" class="form-control form-control-sm" autocomplete="off">
      </div>
      <div class="mb-2">
        <label class="form-label">Mô tả</label>
        <textarea id="inp-cn-mota" class="form-control form-control-sm" rows="2"></textarea>
      </div>
      <div class="form-check">
        <input type="checkbox" id="chk-cn-tt" class="form-check-input" checked>
        <label class="form-check-label" for="chk-cn-tt">Hoạt động</label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Hủy</button>
      <button class="btn btn-primary btn-sm" onclick="saveCN()">Lưu</button>
    </div>
  </div></div>
</div>

<script src="../libs/bootstrap.bundle.min.js"></script>
<script src="../libs/sweetalert2.all.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/auth/token.js"></script>
<script src="../js/auth/guard.js"></script>
<script src="../js/auth/permission.js"></script>
<script src="../js/components/loading.js"></script>
<script src="../js/components/toast.js"></script>
<script src="../js/components/confirm.js"></script>
<script src="../js/components/modal.js"></script>
<script src="../js/components/datatable.js"></script>
<script src="../js/components/sidebar.js"></script>
<script src="../js/components/topbar.js"></script>
<script src="../js/api/client.js"></script>
<script src="../js/api/authApi.js"></script>
<script src="../js/api/nganhApi.js"></script>
<script src="../js/api/chuyenNganhApi.js"></script>
<script src="../js/utils/constants.js"></script>
<script src="../js/utils/formatter.js"></script>
<script src="../js/utils/validator.js"></script>
<script src="../js/pages/chuyenNganh.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    await loadTopbar();
    await loadSidebar();
    loadCN();
  });
</script>
</body>
</html>
