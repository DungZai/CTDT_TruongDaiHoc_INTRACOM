<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ngành — QLCTĐT</title>
  <link rel="stylesheet" href="../libs/bootstrap.min.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/table.css">
  <link rel="stylesheet" href="../css/form.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/topbar.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/modal.css">
</head>
<body>
<main class="main-content">
  <div class="page-header">
    <div><h5>Quản lý Ngành</h5></div>
    <button class="btn btn-primary btn-sm" onclick="openNganh()" data-role="ADMIN">+ Thêm ngành</button>
  </div>
  <div class="filter-bar">
    <input type="text" id="inp-search-nganh" class="form-control form-control-sm" style="width:260px"
      placeholder="Tìm mã ngành, tên ngành..." oninput="filterTable('inp-search-nganh','tbody-nganh')">
  </div>
  <div class="table-responsive">
    <table class="table table-hover">
      <thead><tr><th>#</th><th>Mã ngành</th><th>Tên ngành</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
      <tbody id="tbody-nganh"></tbody>
    </table>
  </div>
</main>

<div class="modal fade" id="modal-nganh" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header">
      <h6 class="modal-title" id="modal-nganh-title">Thêm ngành</h6>
      <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">
      <div class="mb-2">
        <label class="form-label">Mã ngành <span class="text-danger">*</span></label>
        <input type="text" id="inp-ma-nganh" class="form-control form-control-sm" placeholder="VD: CNTT">
      </div>
      <div class="mb-2">
        <label class="form-label">Tên ngành <span class="text-danger">*</span></label>
        <input type="text" id="inp-ten-nganh" class="form-control form-control-sm">
      </div>
      <div class="mb-2">
        <label class="form-label">Mô tả</label>
        <textarea id="inp-nganh-mota" class="form-control form-control-sm" rows="2"></textarea>
      </div>
      <div class="form-check">
        <input type="checkbox" id="chk-nganh-tt" class="form-check-input" checked>
        <label class="form-check-label" for="chk-nganh-tt">Hoạt động</label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Hủy</button>
      <button class="btn btn-primary btn-sm" onclick="saveNganh()">Lưu</button>
    </div>
  </div></div>
</div>

<script src="../libs/bootstrap.bundle.min.js"></script>
<script src="../libs/sweetalert2.all.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/auth/token.js"></script>
<script src="../js/auth/guard.js"></script>
<script src="../js/auth/permission.js"></script>
<script src="../js/components/loading.js"></script>
<script src="../js/components/toast.js"></script>
<script src="../js/components/confirm.js"></script>
<script src="../js/components/modal.js"></script>
<script src="../js/components/datatable.js"></script>
<script src="../js/components/sidebar.js"></script>
<script src="../js/components/topbar.js"></script>
<script src="../js/api/client.js"></script>
<script src="../js/api/authApi.js"></script>
<script src="../js/api/nganhApi.js"></script>
<script src="../js/utils/constants.js"></script>
<script src="../js/utils/formatter.js"></script>
<script src="../js/utils/validator.js"></script>
<script src="../js/pages/nganh.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', async () => {
    await loadTopbar();
    await loadSidebar();
    loadNganh();
  });
</script>
</body>
</html>
