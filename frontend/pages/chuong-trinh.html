<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chương trình ĐT — QLCTĐT</title>
  <link rel="stylesheet" href="../libs/bootstrap.min.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/table.css">
  <link rel="stylesheet" href="../css/form.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
<main class="main-content">
  <div class="page-header">
    <div><h5>Chương trình đào tạo</h5></div>
    <button class="btn btn-primary btn-sm" onclick="openCT()" data-role="ADMIN">+ Thêm</button>
  </div>
  <div class="filter-bar">
    <select id="sel-ct-nganh-filter" class="form-select form-select-sm" style="width:180px" onchange="filterCT()"></select>
    <select id="sel-ct-he-filter"    class="form-select form-select-sm" style="width:160px" onchange="filterCT()"></select>
    <input type="text" id="inp-search-ct" class="form-control form-control-sm" style="width:200px"
      placeholder="Tìm kiếm..." oninput="filterTable('inp-search-ct','tbody-ct')">
  </div>
  <div class="table-responsive">
    <table class="table table-hover">
      <thead><tr><th>#</th><th>Tên chương trình</th><th>Ngành</th><th>Hệ</th><th>TC</th><th>Năm PH</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
      <tbody id="tbody-ct"></tbody>
    </table>
  </div>
</main>

<div class="modal fade" id="modal-ct" tabindex="-1">
  <div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header">
      <h6 class="modal-title" id="modal-ct-title">Thêm chương trình</h6>
      <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body row g-2">
      <div class="col-12">
        <label class="form-label">Tên chương trình <span class="text-danger">*</span></label>
        <input type="text" id="inp-ten-ct" class="form-control form-control-sm">
      </div>
      <div class="col-md-6">
        <label class="form-label">Ngành <span class="text-danger">*</span></label>
        <select id="inp-ct-nganh" class="form-select form-select-sm"></select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Hệ đào tạo <span class="text-danger">*</span></label>
        <select id="inp-ct-he" class="form-select form-select-sm"></select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Tổng tín chỉ <span class="text-danger">*</span></label>
        <input type="number" id="inp-ct-tc" class="form-control form-control-sm" min="1">
      </div>
      <div class="col-md-6">
        <label class="form-label">Năm phát hành <span class="text-danger">*</span></label>
        <input type="number" id="inp-ct-nam" class="form-control form-control-sm" min="2000" max="2100">
      </div>
      <div class="col-12">
        <label class="form-label">Mô tả</label>
        <textarea id="inp-ct-mota" class="form-control form-control-sm" rows="2"></textarea>
      </div>
      <div class="col-12">
        <div class="form-check">
          <input type="checkbox" id="chk-ct-tt" class="form-check-input" checked>
          <label class="form-check-label" for="chk-ct-tt">Hoạt động</label>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Hủy</button>
      <button class="btn btn-primary btn-sm" onclick="saveCT()">Lưu</button>
    </div>
  </div></div>
</div>

<script src="../libs/bootstrap.bundle.min.js"></script>
<script src="../libs/sweetalert2.all.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/auth/token.js"></script>
<script src="../js/auth/guard.js"></script>
<script src="../js/auth/permission.js"></script>
<script src="../js/components/loading.js"></script>
<script src="../js/components/toast.js"></script>
<script src="../js/components/confirm.js"></script>
<script src="../js/components/modal.js"></script>
<script src="../js/components/datatable.js"></script>
<script src="../js/components/sidebar.js"></script>
<script src="../js/api/client.js"></script>
<script src="../js/api/authApi.js"></script>
<script src="../js/api/nganhApi.js"></script>
<script src="../js/api/heDaoTaoApi.js"></script>
<script src="../js/api/chuongTrinhApi.js"></script>
<script src="../js/utils/constants.js"></script>
<script src="../js/utils/formatter.js"></script>
<script src="../js/utils/validator.js"></script>
<script src="../js/pages/chuongTrinh.js"></script>
<script>document.addEventListener('DOMContentLoaded', loadCT);</script>
</body>
</html>
