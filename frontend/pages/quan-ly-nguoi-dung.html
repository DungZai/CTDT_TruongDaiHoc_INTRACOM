<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Người dùng — QLCTĐT</title>
  <link rel="stylesheet" href="../libs/bootstrap.min.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/table.css">
  <link rel="stylesheet" href="../css/form.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/topbar.css">
  <link rel="stylesheet" href="../css/sidebar.css">
</head>
<body>
<main class="main-content">
  <div class="page-header">
    <div><h5>Quản lý người dùng</h5></div>
    <button class="btn btn-primary btn-sm" onclick="openUser()">+ Thêm tài khoản</button>
  </div>
  <div class="filter-bar">
    <input type="text" id="inp-search-user" class="form-control form-control-sm"
      style="width:260px" placeholder="Tìm username, email..."
      autocomplete="off"
      oninput="filterTable('inp-search-user','tbody-users')">
  </div>
  <div class="table-responsive">
    <table class="table table-hover">
      <thead>
        <tr><th>#</th><th>Username</th><th>Email</th><th>Vai trò</th><th>Ngày tạo</th><th></th></tr>
      </thead>
      <tbody id="tbody-users"></tbody>
    </table>
  </div>
</main>

<!-- Modal -->
<div class="modal fade" id="modal-user" tabindex="-1" aria-modal="true" role="dialog">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header">
      <h6 class="modal-title" id="modal-user-title">Thêm tài khoản</h6>
      <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body row g-2">
      <!-- Trick chặn browser autocomplete -->
      <input type="text" style="display:none" aria-hidden="true">
      <input type="password" style="display:none" aria-hidden="true">
      <div class="col-12">
        <label class="form-label">Username <span class="text-danger">*</span></label>
        <input type="text" id="inp-username" class="form-control form-control-sm"
          autocomplete="off">
      </div>
      <div class="col-12" id="wrap-user-pw">
        <label class="form-label">Mật khẩu <span class="text-danger">*</span></label>
        <input type="password" id="inp-user-pw" class="form-control form-control-sm"
          autocomplete="new-password">
      </div>
      <div class="col-12">
        <label class="form-label">Email</label>
        <input type="email" id="inp-user-email" class="form-control form-control-sm"
          autocomplete="off">
      </div>
      <div class="col-12">
        <label class="form-label">Vai trò <span class="text-danger">*</span></label>
        <select id="inp-user-role" class="form-select form-select-sm"></select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Hủy</button>
      <button class="btn btn-primary btn-sm" onclick="saveUser()">Lưu</button>
    </div>
  </div></div>
</div>

<script src="../libs/bootstrap.bundle.min.js"></script>
<script src="../libs/sweetalert2.all.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/auth/token.js"></script>
<script src="../js/auth/guard.js"></script>
<script src="../js/auth/permission.js"></script>
<script src="../js/components/loading.js"></script>
<script src="../js/components/toast.js"></script>
<script src="../js/components/confirm.js"></script>
<script src="../js/components/modal.js"></script>
<script src="../js/components/datatable.js"></script>
<script src="../js/components/sidebar.js"></script>
<script src="../js/components/topbar.js"></script>
<script src="../js/api/client.js"></script>
<script src="../js/api/authApi.js"></script>
<script src="../js/api/userApi.js"></script>
<script src="../js/utils/constants.js"></script>
<script src="../js/utils/formatter.js"></script>
<script src="../js/utils/validator.js"></script>
<script src="../js/pages/nguoiDung.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    await loadTopbar();
    await loadSidebar();
    loadUsers();
  });
</script>
</body>
</html>
