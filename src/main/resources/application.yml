server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: intracom-training-management

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=CTDTDH_INTRACOM;encrypt=true;trustServerCertificate=true
    username: sa
    password: 12345
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect
        # ✅ Giữ nguyên tên bảng/cột như trong @Table, @Column — không tự chuyển sang snake_case
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT config
app:
  jwt:
    secret: IntracomTrainingSecretKey2024_MustBe32CharactersOrMore!
    expiration-ms: 86400000

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha