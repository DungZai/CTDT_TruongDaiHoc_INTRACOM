spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=CTDTDH_INTRACOM;encrypt=true;trustServerCertificate=true
    username: sa
    password: your_dev_password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Ghi log chi tiết hơn ở môi trường dev
logging:
  level:
    vn.intracom.training: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

app:
  jwt:
    secret: IntracomDevSecretKey2024_MustBe32CharactersOrMore!
    expiration-ms: 86400000   # 24 giờ